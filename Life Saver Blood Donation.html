<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blood_donner_reg_form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            text-align: center;
        }

        h2 {
            color: red;
        }

        form {
            background-color: white;
            border: 1px solid gray;
            padding: 20px;
            width: 800px;
            margin: 0 auto 30px auto;
            text-align: left;
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
            border: 1px solid gray;
        }

        input[type="radio"] {
            width: auto;
        }

        textarea {
            resize: none;
        }

        input[type="submit"] {
            background-color: green;
            color: white;
            padding: 8px 15px;
            border: none;
            margin-top: 10px;
        }

        table {
            width: 800px;
            margin: 0 auto 30px auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid gray;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: darkred;
            color: white;
        }
    </style>
</head>
<body>
    <h2>Blood Donner Registration Form</h2>
    <form action="#" method="post">

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="age">Age:</label><br>
        <input type="text" id="age" name="Age" required><br><br>

         <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <label for="bloodGroup">Blood Group:</label><br>
        <select id="bloodGroup" name="Blood Group">
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="B-">A+</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            </select><br><br>

        <label for="PhoneNumber">Phone Number:</label><br>
        <input type="text" id="PhoneNumber" name="Phone Number" required><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="50"></textarea><br><br>

        <label for="dob">Last Donation Date:</label><br>
        <input type="date" id="dob" name="Last Donation Date"><br><br>

        <label for="HealthCondition ">Health Condition:</label><br>
        <input type="text" id="HealthCondition" name="Health Condition" required><br><br>

        <input type="submit" value="Register">

    </form>

    <h2>Blood Request From</h2>
    <form action="#" method="post">

        <label for="Patientname">Patient Name:</label><br>
        <input type="text" id="Patientname" name="Patient Name" required><br><br>

        <label for="requiredbloodgroup">Required Blood Group:</label><br>
        <select id="requiredbloodgroup" name="Required Blood Group">
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="B-">A+</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            </select><br><br>

            
        <label for="hospitalname">Hospital Name:</label><br>
        <input type="text" id="hospitalname" name="Hospital Name" required><br><br>

        <label for="Emergency">Emergency Contact Number:</label><br>
        <input type="text" id="emergency" name="Emergency Contact Number" required><br><br>

        <label for="rdob">Required Date:</label><br>
        <input type="date" id="rdob" name="Required Date"><br><br>

        <label for="Addmessage">Additional Message:</label><br>
        <textarea id="Addmessage" name="Additional Message" rows="4" cols="50"></textarea><br><br>

        <input type="submit" value="Submit Request">

    </form>

    <h2>Available Blood Groups and Registered Donors</h2>
    <table>
        <tr>
            <th>Blood Group</th>
            <th>Registered Donors</th>
        </tr>
        <tr><td>A+</td><td>32</td></tr>
        <tr><td>A-</td><td>10</td></tr>
        <tr><td>B+</td><td>28</td></tr>

        <tr><td>O-</td><td>12</td></tr>
    </table>

</body>
</html>
